name: Telegram Mini Apps — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'telegram-mini-apps/**'
      - '.github/workflows/telegram-mini-apps-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: telegram-mini-apps-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/garden-angel _site/bot-350 _site/shared
          cp telegram-mini-apps/garden-angel/index.html _site/garden-angel/
          cp telegram-mini-apps/bot-350/index.html _site/bot-350/
          cp telegram-mini-apps/shared/style.css _site/shared/
          cp telegram-mini-apps/.nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
