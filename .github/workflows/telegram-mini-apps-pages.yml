name: Telegram Mini Apps — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'telegram-mini-apps/**'
      - '.github/workflows/telegram-mini-apps-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: telegram-mini-apps-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/bot-350 _site/shared
          cp telegram-mini-apps/bot-350/index.html _site/bot-350/
          cp telegram-mini-apps/shared/style.css _site/shared/
          touch _site/.nojekyll
          test -f _site/bot-350/index.html
          test -f _site/shared/style.css
          ls -la _site _site/bot-350 _site/shared

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Delete stale github-pages artifact from previous attempts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
